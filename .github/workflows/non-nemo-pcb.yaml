name: Non-Nemo PCB

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:

jobs:
  KiBot-Generation:
    runs-on: ubuntu-latest  # Don't change
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Generate gerber for Non Nemo Chimera
      uses: INTI-CMNB/KiBot@v1.8.1
      with:
        config: .kibot.yaml
        dir: wireless/non-nemo-chimera/gerber
        board: wireless/non-nemo-chimera/non_nemo_chimera.kicad_pcb
        schema: wireless/non-nemo-chimera/non_nemo_chimera.kicad_sch

    - name: Generate gerber for Non Nemo Low profile
      uses: INTI-CMNB/KiBot@v1.8.1
      with:
        config: .kibot.yaml
        dir: wireless/non-nemo-low/gerber
        board: wireless/non-nemo-low/non_nemo_low.kicad_pcb
        schema: wireless/non-nemo-low/non_nemo_low.kicad_sch

    - name: Generate gerber for Non Nemo MX profile
      uses: INTI-CMNB/KiBot@v1.8.1
      with:
        config: .kibot.yaml
        dir: wireless/non-nemo-mx/gerber
        board: wireless/non-nemo-mx/non_nemo_mx.kicad_pcb
        schema: wireless/non-nemo-mx/non_nemo_mx.kicad_sch

    - name: Generate gerber for Non Nemo Chimera Wired
      uses: INTI-CMNB/KiBot@v1.8.1
      with:
        config: .kibot.yaml
        dir: wired/non-nemo-chimera/gerber
        board: wired/non-nemo-chimera/non_nemo_chimera_wired.kicad_pcb
        schema: wired/non-nemo-chimera/non_nemo_chimera_wired.kicad_sch

    - name: Zip Gerber files
      run: |
          zip -r --junk-paths non-nemo-chimera.zip wireless/non-nemo-chimera/gerber
          zip -r --junk-paths non-nemo-low.zip wireless/non-nemo-low/gerber
          zip -r --junk-paths non-nemo-mx.zip wireless/non-nemo-mx/gerber
          zip -r --junk-paths non-nemo-chimera-wired.zip wired/non-nemo-chimera/gerber

    - name: GH Release
      uses: softprops/action-gh-release@v0.1.15
      with:
        files: "*.zip"
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
